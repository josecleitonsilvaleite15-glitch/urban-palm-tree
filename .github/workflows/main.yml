Arquivo de fluxo de trabalho para esta execução.
.github/workflows/main.yml em 750b16d
nome : Gerar APK mundo calmo

em : [push, workflow_dispatch]

empregos :
  build-apk :
    runs-on : ubuntu-latest
    passos :
      - usa : actions/checkout@v4

      - nome : Extrair projeto do ZIP
        executar : |
          se [ ! -f "package.json" ]; então
            ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
            mkdir -p /tmp/app_src
            unzip -o "$ZIP_FILE" -d /tmp/app_src
            PROJ_DIR=$(dirname "$(find /tmp/app_src -maxdepth 3 -name 'package.json' | head -n 1)")
            cp -a "$PROJ_DIR/." .
          fi
      - usa : actions/setup-node@v4
        com :
          versão do nó : ' 22 '

      - usa : actions/setup-java@v4
        com :
          distribuição : ' temurin '
          versão do java : ' 21 '

      - usa : android-actions/setup-android@v3

      - nome : Instalar o SDK do Android 36
        executar : |
          sim | sdkmanager --licenses > /dev/null 2>&1 || verdadeiro
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name : Instalar e gerar build
        executar : |
          npm install --legacy-peer-deps
          execute o comando `npm run build`
      - nome : Preparar Android
        executar : |
          se [ ! -f "capacitor.config.json" ]; então
            npx cap init "mundo calmo" "com.mundocalmo.app" --web-dir dist
          fi
          se [ ! -d "android" ]; então
            npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
            npx cap adicionar android
          outro
            npx cap sync android
          fi
      - nome : Gerar APK
        executar : |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - nome : Preparar APK final
        executar : cp android/app/build/outputs/apk/debug/app-debug.apk mundo-calmo.apk

      - usa : actions/upload-artifact@v4
        com :
          nome : mundo-calmo-apk
          caminho : mundo-calmo.apk
